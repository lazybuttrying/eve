global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: geth
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: ["geth:6060"]
        labels: { node: node1 }
      - targets: ["geth2:6060"]
        labels: { node: node2 }

  - job_name: lighthouse
    static_configs:
      - targets: ["lighthouse:5054"]
        labels: { node: node1 }
      - targets: ["lighthouse2:5054"]
        labels: { node: node2 }

  - job_name: validator
    static_configs:
      - targets: ["validator:5064"]
        labels: { node: node1 }

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
