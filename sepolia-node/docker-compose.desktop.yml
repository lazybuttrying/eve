# Docker Desktop (Windows / macOS)용 덮어쓰기 파일
#   docker compose -f docker-compose.yml -f docker-compose.desktop.yml up -d
# 또는 .env 에 COMPOSE_FILE=docker-compose.yml:docker-compose.desktop.yml (Windows는 ; 로 구분) 을 넣으면
# 매번 -f 를 붙이지 않아도 됩니다.
#
# 바뀌는 점
# 1) 체인 데이터를 호스트 폴더(./data) 대신 Docker 볼륨에 저장합니다.
#    Docker Desktop은 Linux VM 안에서 컨테이너를 돌리기 때문에, Windows/macOS 폴더를 붙이면
#    파일 I/O가 VM 경계를 넘어 크게 느려집니다. 동기화가 끝나지 않는 가장 흔한 원인입니다.
# 2) node-exporter 의 rslave 마운트 옵션을 뺍니다 (macOS Docker Desktop에서 실패).
#    node-exporter 가 보는 CPU/메모리/디스크는 내 PC가 아니라 Docker Desktop VM 기준입니다.

services:
  geth:
    volumes:
      - geth-data:/data
  lighthouse:
    volumes:
      - lighthouse-data:/data
  prometheus:
    volumes:
      - prometheus-data:/prometheus
  grafana:
    volumes:
      - grafana-data:/var/lib/grafana
  node-exporter:
    volumes:
      - /:/host:ro

volumes:
  geth-data:
  lighthouse-data:
  prometheus-data:
  grafana-data:
